# Part 9: run the offline tests on every push, and the model evals when an OPENAI_API_KEY secret exists.
name: agent-evals
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q                      # offline, no API key needed
  evals:
    runs-on: ubuntu-latest
    needs: test
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MODEL: openai:gpt-5.4-mini
    steps:
      - if: env.OPENAI_API_KEY == ''
        run: echo "No OPENAI_API_KEY secret set, skipping the model evals."
      - uses: actions/checkout@v5
        if: env.OPENAI_API_KEY != ''
      - uses: actions/setup-python@v6
        if: env.OPENAI_API_KEY != ''
        with:
          python-version: "3.12"
      - if: env.OPENAI_API_KEY != ''
        run: pip install -r requirements.txt
      - if: env.OPENAI_API_KEY != ''
        run: python -m part05_rag.ingest
      - if: env.OPENAI_API_KEY != ''
        run: pytest part09_evals -m evals -q
